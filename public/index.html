<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIFTY OI Command Center</title>
    <!-- Import Plotly directly to the browser -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
        .panel { background-color: #111827; padding: 20px; border-radius: 6px; border: 1px solid #1f2937; margin-bottom: 20px; }
        .metric-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-size: 24px; font-weight: bold; color: #f8fafc; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="metric-title">Spot Price</div>
        <div class="metric-value" id="spot-price">Loading...</div>
    </div>

    <div class="panel">
        <div class="metric-title">📊 TOTAL OPEN INTEREST</div>
        <div id="oi-chart"></div>
    </div>

    <script>
        async function fetchLiveFlow() {
            try {
                // Call your Python FastAPI endpoint
                const response = await fetch('/api/nifty-oi?symbol=NIFTY');
                const result = await response.json();
                
                document.getElementById('spot-price').innerText = result.spot_price.toFixed(2);
                
                // Prepare Plotly Traces
                const strikes = result.data.map(d => d.strike);
                const ce_oi = result.data.map(d => d.ce_oi);
                const pe_oi = result.data.map(d => d.pe_oi);

                const traceCE = { x: strikes, y: ce_oi, name: 'Call OI', type: 'bar', marker: {color: '#ef4444'} };
                const tracePE = { x: strikes, y: pe_oi, name: 'Put OI', type: 'bar', marker: {color: '#22c55e'} };
                
                const layout = { 
                    barmode: 'group', 
                    paper_bgcolor: '#111827', 
                    plot_bgcolor: '#111827', 
                    font: {color: '#94a3b8'},
                    margin: { t: 20, b: 40, l: 40, r: 20 }
                };
                
                Plotly.newPlot('oi-chart', [traceCE, tracePE], layout);
            } catch (error) {
                console.error("Data Fetch Failed:", error);
                document.getElementById('spot-price').innerText = "API Error";
            }
        }
        
        // Initial load
        fetchLiveFlow();
        // Auto-refresh every 3 minutes (180,000 milliseconds)
        setInterval(fetchLiveFlow, 180000);
    </script>

</body>
</html>
